[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devmind"
version = "0.1.0"
description = "AI-powered developer productivity tools"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "httpx",
]

[project.scripts]
devmind = "cli:app"

[tool.setuptools]
py-modules = ["cli"]